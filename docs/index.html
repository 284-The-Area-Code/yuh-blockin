<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal - Yuh Blockin'</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        h1 {
            color: #1a1a2e;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .tagline {
            color: #666;
            font-size: 1rem;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .link-card:hover {
            background: #fff;
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.2);
        }
        .link-icon {
            font-size: 1.8rem;
            margin-right: 15px;
        }
        .link-content {
            text-align: left;
        }
        .link-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a1a2e;
        }
        .link-desc {
            font-size: 0.9rem;
            color: #666;
        }
        .arrow {
            margin-left: auto;
            font-size: 1.2rem;
            color: #e94560;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .card {
                padding: 35px 25px;
            }
            .logo {
                font-size: 3rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🚗</div>
            <h1>Yuh Blockin'</h1>
            <p class="tagline">Vehicle Alert System</p>

            <div class="links">
                <a href="privacy.html" class="link-card">
                    <span class="link-icon">🔒</span>
                    <div class="link-content">
                        <div class="link-title">Privacy Policy</div>
                        <div class="link-desc">How we handle your data</div>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="terms.html" class="link-card">
                    <span class="link-icon">📄</span>
                    <div class="link-content">
                        <div class="link-title">Terms of Service</div>
                        <div class="link-desc">Rules for using the app</div>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="support.html" class="link-card">
                    <span class="link-icon">💬</span>
                    <div class="link-content">
                        <div class="link-title">Support</div>
                        <div class="link-desc">Get help & FAQs</div>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="copyright.html" class="link-card">
                    <span class="link-icon">©</span>
                    <div class="link-content">
                        <div class="link-title">Copyright</div>
                        <div class="link-desc">Intellectual property info</div>
                    </div>
                    <span class="arrow">→</span>
                </a>
            </div>

            <div class="footer">
                <p>Need help? Contact us at<br><a href="mailto:dev@dezetingz.ai">dev@dezetingz.ai</a></p>
            </div>
        </div>
    </div>
</body>
</html>
