org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Network timeout settings for slow connections
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Play Console's App Bundle Explorer flagged DEX optimization as "Low" (30%)
# on build 33, with "Resource Shrinking Optimized" listed as off. This folds
# resource shrinking into R8's code-optimization pass (treats resources as
# part of the program graph) instead of running as a separate, less precise
# step. AGP 8.12-8.13 range (we're pinned to 8.13.2): opt-in flag. AGP 9+
# enables this automatically, so the flag can be dropped on that upgrade.
android.r8.optimizedResourceShrinking=true
